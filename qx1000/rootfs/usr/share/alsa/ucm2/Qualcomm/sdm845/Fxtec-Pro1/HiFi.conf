# F(x)tec Pro1: WCD9340 + two WSA8815 over SLIMbus; routes as stock "speaker"/"dmic"
# ponytail: fixed hardware gain, PipeWire does software volume. No headset jack yet.

SectionVerb {
	EnableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
		# routes live in the verb: PipeWire probes the PCMs with no device enabled
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='SLIM RX1 MUX' AIF1_PB"
		cset "name='RX INT7_1 MIX1 INP0' RX1"
		cset "name='RX INT8_1 MIX1 INP0' RX0"
		cset "name='AIF1_CAP Mixer SLIM TX7' 1"
		cset "name='CDC_IF TX7 MUX' DEC7"
		cset "name='ADC MUX7' DMIC"
		cset "name='DMIC MUX7' DMIC0"
		cset "name='DEC7 Volume' 84"
		cset "name='AIF1_CAP Mixer SLIM TX8' 1"
		cset "name='CDC_IF TX8 MUX' DEC8"
		cset "name='ADC MUX8' DMIC"
		cset "name='DMIC MUX8' DMIC1"
		cset "name='DEC8 Volume' 84"
	]
	DisableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
		cset "name='AIF1_CAP Mixer SLIM TX7' 0"
		cset "name='AIF1_CAP Mixer SLIM TX8' 0"
		cset "name='RX INT7_1 MIX1 INP0' ZERO"
		cset "name='RX INT8_1 MIX1 INP0' ZERO"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='COMP7 Switch' 1"
		cset "name='COMP8 Switch' 1"
		cset "name='RX7 Digital Volume' 84"
		cset "name='RX8 Digital Volume' 84"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrRight COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrRight BOOST Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='SpkrLeft PA Volume' 12"
		cset "name='SpkrRight PA Volume' 12"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrRight DAC Switch' 1"
	]
	DisableSequence [
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrRight DAC Switch' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Microphones"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 2
	}
}
