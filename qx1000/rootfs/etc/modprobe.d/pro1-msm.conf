# MSM8998 display handover from the UEFI framebuffer (see scripts/README in the project):
# 1. The MMSS SMMU must not runtime-suspend while the UEFI splash is still scanned out
#    through it (stalls the NoC, SoC hangs). Pin it on before mmcc lets it probe.
#    ponytail: never released, the SMMU stays clocked (idle power cost).
install mmcc_msm8998 echo on > /sys/bus/platform/devices/cd00000.iommu/power/control; /usr/sbin/modprobe --ignore-install mmcc_msm8998 $CMDLINE_OPTS
# 2. Stop the splash scan-out right before msm attaches its own IOMMU domain.
install msm /usr/local/bin/pro1-stop-splash; /usr/sbin/modprobe --ignore-install msm $CMDLINE_OPTS
