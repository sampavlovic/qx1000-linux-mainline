# The ADSP reads its PCM buffers through the LPASS SMMU. iommu.passthrough=1 would
# hand it raw physical addresses (RAM goes above 4 GB, out of its reach), so switch
# the q6asm-dai device to a translated domain before the driver binds, as for WiFi.
install q6asm_dai echo DMA > "/sys/bus/platform/devices/17300000.remoteproc:glink-edge:apr:service@7:dais/iommu_group/type"; /usr/sbin/modprobe --ignore-install q6asm_dai $CMDLINE_OPTS
