# WCN3990 must DMA through a translated SMMU domain: with the identity domain that
# iommu.passthrough=1 gives everything (needed for the display handover), the first
# HTC message from the WLAN core never reaches host memory. Switch only the WiFi
# group to DMA before the driver binds.
install ath10k_snoc echo DMA > /sys/bus/platform/devices/18800000.wifi/iommu_group/type; /usr/sbin/modprobe --ignore-install ath10k_snoc $CMDLINE_OPTS
# IPA maps IMEM/SMEM through its IOMMU, impossible in an identity domain: same fix.
install ipa echo DMA > /sys/bus/platform/devices/1e40000.ipa/iommu_group/type; /usr/sbin/modprobe --ignore-install ipa $CMDLINE_OPTS
