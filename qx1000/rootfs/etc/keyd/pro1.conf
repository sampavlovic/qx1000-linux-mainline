# F(x)tec Pro1 fn layer (stock qx1000.c qwerty_fn_keys) as real key presses, so it works
# in every app (the XKB level-3 "pro1" layout stays as the fallback without keyd).
# fn = both yellow-arrow keys (GPIO 32/33, RIGHTALT in the device tree).
# Only the two keyboards: keyd ids are vendor:product:hash(name, key count), so a
# keymap change in the device tree changes them (keyd monitor lists the new ones).
[ids]
0000:0000:cd29c767
0001:0001:2fc144d5

[main]
rightalt = layer(fn)

[fn]
1 = S-1
2 = S-2
3 = S-3
4 = S-4
5 = S-5
6 = S-6
7 = S-7
8 = S-8
9 = S-9
0 = S-0
minus = S-minus
equal = S-equal
leftbrace = S-leftbrace
rightbrace = S-rightbrace
semicolon = S-semicolon
apostrophe = S-apostrophe
grave = S-grave
backslash = S-backslash
comma = S-comma
dot = S-dot
p = slash
l = S-slash
up = pageup
down = pagedown
left = home
right = end
delete = insert
