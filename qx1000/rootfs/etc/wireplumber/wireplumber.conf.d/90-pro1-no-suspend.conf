# pro1: the WCD9340/ADSP SLIMbus path only carries samples on the first stream
# per channel set after boot (a reopened PCM reads zeros / plays silence), so keep
# ALSA nodes open instead of suspending them after 5 s idle.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
